# Theme + server settings for the SugboDoc Streamlit app (streamlit_app.py + pages/).
[theme]
primaryColor = "#3b41d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f5fb"
textColor = "#1f2430"
font = "sans serif"

[server]
# Audio uploads on the Consultation Transcript page.
maxUploadSize = 200
# Community Cloud ignores this; useful for local `streamlit run`.
headless = true
# Re-run the open page whenever a source file is saved -- no restart, no refresh.
runOnSave = true
