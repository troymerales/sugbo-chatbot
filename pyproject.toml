[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sugbodoc-assistant"
version = "0.1.0"
description = "Documentation-grounded support chatbot for SugboDoc, a clinic / practice-management SaaS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Core runtime (the answer/verify pipeline + analytics). Kept in sync with
# requirements.txt — pick either to install.
dependencies = [
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "numpy>=1.26",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# FastAPI backend + PostgreSQL persistence (requirements-service.txt)
service = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
]
# Streamlit demo UI
streamlit = ["streamlit>=1.37"]
# Everything needed to run the full test suite (requirements-dev.txt)
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "SQLAlchemy>=2.0",
]

[tool.setuptools]
# a mix of top-level modules and packages
py-modules = ["config", "app"]
packages = ["core", "api", "evaluation", "analytics", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
