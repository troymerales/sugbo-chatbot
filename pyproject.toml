[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sugbodoc"
version = "0.2.0"
description = "SugboDoc — a Streamlit app: doc-grounded support chatbot + Bisaya speech-to-SOAP for a clinic SaaS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Streamlit runtime — chatbot pipeline + assistant widget + STT→SOAP workflow.
# In sync with requirements.txt (pick either to install).
dependencies = [
    "streamlit>=1.37",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "pydantic>=2",
    "SQLAlchemy>=2.0",        # chat-log persistence (only used when DATABASE_URL is set)
    "psycopg[binary]>=3.1",
    "pandas>=2.0",            # Past Notes / Evaluation tables
    "jiwer>=3.0",             # WER / CER scoring
    "reportlab>=4.0",         # PDF export
]

[project.optional-dependencies]
# The test suite (requirements-dev.txt)
dev = ["pytest>=8.0"]

[tool.setuptools]
py-modules = ["config", "streamlit_app", "home", "stt_ui", "shell"]
packages = ["core", "assistant", "stt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
