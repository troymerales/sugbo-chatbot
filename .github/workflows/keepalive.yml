name: Keepalive

# Supabase pauses a free project after 7 days with NO database queries. If the
# live site gets little traffic, this scheduled ping keeps the project awake by
# hitting /readyz (which runs a `SELECT 1`). It doubles as a smoke test: a red
# run means prod is down.
#
# PROD_URL is a repository *variable* (not a secret — it's a public URL):
#   Settings -> Secrets and variables -> Actions -> Variables -> New
#   e.g.  https://sugbodoc-api.onrender.com
#
# Cron is UTC. "0 6 */5 * *" = 06:00 UTC every 5th day. Well inside the 7-day
# window even accounting for GitHub's scheduling jitter.

on:
  schedule:
    - cron: "0 6 */5 * *"
  workflow_dispatch: {}          # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /readyz
        env:
          URL: ${{ vars.PROD_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "PROD_URL variable not set — nothing to ping."
            exit 0
          fi
          echo "GET $URL/readyz"
          # --retry: the free instance may be cold; give it time to wake.
          curl -fsS --retry 5 --retry-all-errors --retry-delay 15 --max-time 90 "$URL/readyz"
