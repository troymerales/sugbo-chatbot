name: Deploy ASR to HF Spaces

on:
  push:
    branches: [main]
    paths:
      - 'deploy/asr-space/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Push to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://huggingface.co/spaces/troymerales/sugbodoc-asr ./hf-space
          cp -r deploy/asr-space/* ./hf-space/
          cd ./hf-space
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add .
          git commit -m "Auto-deploy from GitHub" || true
          git push https://oauth2:${HF_TOKEN}@huggingface.co/spaces/troymerales/sugbodoc-asr main