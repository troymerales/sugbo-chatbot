name: Deploy ASR to HF Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          mkdir -p hf-space
          git clone https://huggingface.co/spaces/${HF_USERNAME}/sugbodoc-demo hf-space
          cp -r deploy/asr-space/* hf-space/
          cd hf-space
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add .
          git commit -m "Auto-deploy from GitHub" || true
          git push https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/sugbodoc-demo main
